rules:
  - id: java-ssrf-structured-destination-candidate
    message: URL-like structured field reaches a server-side network client
    severity: WARNING
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: $CLIENT.getForObject($JSON.get($FIELD).asText(), ...)
          - pattern: $CLIENT.postForObject($JSON.get($FIELD).asText(), ...)
          - pattern: $CLIENT.exchange($JSON.get($FIELD).asText(), ...)
          - pattern: $BUILDER.url($JSON.get($FIELD).asText())
          - pattern: new URL($JSON.get($FIELD).asText())
      - metavariable-regex:
          metavariable: $FIELD
          regex: '\"(?i:url|api|endpoint|webhook|callback|baseurl|host)\"'
    metadata:
      cwe: CWE-918
      subtype: structured-destination
      confidence: medium
      candidate_only: true
      notes: Confirm external document control, deferred persistence path when present, destination influence, and missing effective network controls.

  - id: java-ssrf-host-concat
    message: Host or base URL built by concatenating user input
    severity: WARNING
    languages: [java]
    pattern-either:
      - pattern: |
          "http://" + $HOST + $PATH
      - pattern: |
          "https://" + $HOST + $PATH
      - pattern: |
          "http://" + $HOST
      - pattern: |
          "https://" + $HOST
      - pattern: |
          String.format("http://%s", $HOST)
      - pattern: |
          String.format("https://%s/%s", $HOST, $PATH)
      - pattern: |
          String.format("%s://%s", $SCHEME, $HOST)
    metadata:
      cwe: CWE-918
      subtype: host-control
      confidence: high

  - id: java-ssrf-weak-startswith
    message: Weak startsWith prefix check on URL (bypassable; not host validation)
    severity: WARNING
    languages: [java]
    pattern-either:
      - pattern: |
          $URL.startsWith("http://")
      - pattern: |
          $URL.startsWith("https://")
      - pattern: |
          $URL.startsWith($PREFIX)
    metadata:
      cwe: CWE-918
      subtype: path-confusion
      confidence: medium
      notes: L1/L3 hint; not a finding without dataflow to network sink

  - id: java-ssrf-base-path-concat
    message: Fixed base URL concatenated with user path may allow destination escape
    severity: WARNING
    languages: [java]
    pattern-either:
      - pattern: |
          $BASE + $USER
      - pattern: |
          $BASE.concat($USER)
      - pattern: |
          String.format("%s%s", $BASE, $USER)
    metadata:
      cwe: CWE-918
      subtype: path-confusion
      confidence: low
      notes: elevate when $BASE is URL-like and result hits HTTP client

  - id: java-ssrf-metadata-literal-hint
    message: Cloud metadata address literal near network client (review destination control)
    severity: INFO
    languages: [java]
    pattern-either:
      - pattern: |
          "169.254.169.254"
      - pattern: |
          "metadata.google.internal"
      - pattern: |
          "100.100.100.200"
    metadata:
      cwe: CWE-918
      subtype: cloud-metadata
      confidence: low
      notes: L0/L1 context only; do not report as finding without user-controlled path
