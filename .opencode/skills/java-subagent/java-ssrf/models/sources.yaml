sources:
  - id: servlet-parameter
    framework: servlet
    method_full_name:
      - ".*HttpServletRequest.*getParameter.*"
      - ".*HttpServletRequest.*getParameterValues.*"
      - ".*HttpServletRequest.*getParameterMap.*"
    controlled_value: return
    confidence: high

  - id: servlet-header
    framework: servlet
    method_full_name:
      - ".*HttpServletRequest.*getHeader.*"
      - ".*HttpServletRequest.*getHeaders.*"
    controlled_value: return
    confidence: high
    notes: >
      X-Forwarded-Host / custom destination headers often feed URL builders.

  - id: servlet-path
    framework: servlet
    method_full_name:
      - ".*HttpServletRequest.*getPathInfo.*"
      - ".*HttpServletRequest.*getRequestURI.*"
      - ".*HttpServletRequest.*getQueryString.*"
      - ".*HttpServletRequest.*getRequestURL.*"
    controlled_value: return
    confidence: medium

  - id: spring-request-param
    framework: spring-mvc
    annotation:
      - RequestParam
      - PathVariable
      - RequestHeader
      - CookieValue
      - MatrixVariable
    controlled_value: annotated_parameter
    confidence: high

  - id: spring-request-body
    framework: spring-mvc
    annotation:
      - RequestBody
      - ModelAttribute
    controlled_value: object_fields
    confidence: medium
    notes: object fields such as url/api/endpoint/webhook/callback/baseUrl/host/port require field-level taint tracking

  - id: structured-document-or-import
    framework: serialization
    method_full_name:
      - ".*ObjectMapper.*readValue.*"
      - ".*ObjectMapper.*readTree.*"
      - ".*JsonNode.*get.*"
      - ".*Yaml.*load.*"
      - ".*Properties.*load.*"
      - ".*Properties.*getProperty.*"
      - ".*MultipartFile.*getInputStream.*"
      - ".*MultipartFile.*getBytes.*"
    controlled_value: parsed_field
    confidence: medium
    notes: >
      Track URL-like fields from JSON/YAML/properties/uploaded or imported files.
      Parsing alone is not evidence; require propagation into a server-side network sink.

  - id: uri-components
    framework: spring
    method_full_name:
      - ".*UriComponentsBuilder\\.fromUriString.*"
      - ".*UriComponentsBuilder\\.fromHttpUrl.*"
      - ".*URI\\.create.*"
      - ".*new URL\\(.*"
    controlled_value: construction_argument
    confidence: medium
    notes: intermediate construction; treat as propagator when input already tainted

  - id: message-queue
    framework: messaging
    method_full_name:
      - ".*Message.*getBody.*"
      - ".*Message.*getPayload.*"
      - ".*ConsumerRecord.*value.*"
    controlled_value: return
    confidence: medium
    notes: async/second-order entry points for webhook or callback URLs

  - id: config-or-db-untrusted
    framework: persistence
    method_full_name:
      - ".*ResultSet.*getString.*"
      - ".*Document\\.get.*"
    controlled_value: return
    confidence: low
    notes: only when a previously stored attacker URL/API/endpoint/webhook/callback/host is reused for outbound fetch; close the original write-to-worker chain
